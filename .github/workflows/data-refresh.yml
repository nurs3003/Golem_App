name: Refresh market data

on:
  schedule:
    # 18:00 UTC = noon MDT (UTC-6). Weekdays only.
    - cron: '0 18 * * 1-5'
  workflow_dispatch:   # allows you to trigger it manually from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to commit feather files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true  # use binary packages — much faster installs

      - name: Install R dependencies
        run: |
          install.packages(c("arrow", "dplyr", "tidyquant", "remotes"))
          remotes::install_github("risktoollib/RTL")
        shell: Rscript {0}

      - name: Generate feather files
        run: Rscript data-raw/generate_data.R

      - name: Commit and push updated feather files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inst/extdata/futures_data.feather inst/extdata/cmt_data.feather
          # Only commit if something actually changed; [skip ci] prevents
          # this commit from triggering the Docker build workflow again.
          git diff --staged --quiet || \
            git commit -m "chore: refresh market data [skip ci]" && \
            git push

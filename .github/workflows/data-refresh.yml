name: Refresh market data

on:
  schedule:
    # 18:00 UTC = noon MDT (UTC-6). Weekdays only.
    - cron: '0 18 * * 1-5'
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # silence Node.js 20 deprecation warning

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to commit feather files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true  # binary CRAN packages — much faster

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev

      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "arrow", "dplyr", "tidyquant"))
          remotes::install_github(
            "risktoollib/RTL",
            upgrade    = "never",
            auth_token = Sys.getenv("GITHUB_TOKEN")
          )
        shell: Rscript {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate feather files
        run: Rscript data-raw/generate_data.R

      - name: Commit and push updated feather files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inst/extdata/futures_data.feather inst/extdata/cmt_data.feather
          if git diff --staged --quiet; then
            echo "No changes to feather files — nothing to commit."
          else
            git commit -m "chore: refresh market data [skip ci]"
            git push
          fi
